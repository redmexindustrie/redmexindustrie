name: Build CyberEdMex Installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ej. 0.1.0)'
        required: false
        default: '0.1.0'
        type: string

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/server/src-tauri
            apps/client/src-tauri

      - name: Install dependencies
        run: pnpm install

      - name: Build Server (NSIS Installer)
        run: pnpm tauri:build:server
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Build Client (NSIS Installer)
        run: pnpm tauri:build:client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Copy installers to dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "installers"
          $server = "apps\server\src-tauri\target\release\bundle\nsis\CyberEdMex Server_0.1.0_x64-setup.exe"
          $client = "apps\client\src-tauri\target\release\bundle\nsis\CyberEdMex Client_0.1.0_x64-setup.exe"
          Copy-Item $server "installers\" -Force
          Copy-Item $client "installers\" -Force
          Compress-Archive -Path "installers\*" -DestinationPath "CyberEdMex_Instalables_v${{ inputs.version }}.zip" -Force

      - name: Upload installers ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cyberedmex-installers
          path: CyberEdMex_Instalables_v${{ inputs.version }}.zip
          retention-days: 7
